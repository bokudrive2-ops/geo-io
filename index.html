<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>geo.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
#panoHost{position:fixed;inset:0;z-index:0;background:#000;visibility:hidden}
#panoHost.on{visibility:visible}
#game.screen{pointer-events:none}#game.screen>*{pointer-events:auto}
#compass,#btnReturn,#zoomBtns,#loadingOv{display:none!important}
#pano{position:absolute;inset:0;background:#000;overflow:hidden}
#pano iframe{width:100%;height:100%;border:0;outline:none}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 6px #0008}
:root{--bg:#120d2e;--bg2:#1f1659;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#f4f1ff;--mut:#a9a1d8;--acc:#38e8c6;--acc2:#7c6cff;--warn:#ffb02e;--bad:#ff5d73;--good:#6be35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Nunito',system-ui,sans-serif;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
h1,h2,h3,.fr{font-family:'Fredoka',sans-serif}
#bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 20% 10%,#3a2a9a55,transparent 60%),radial-gradient(900px 600px at 90% 90%,#12a8a055,transparent 60%),linear-gradient(160deg,var(--bg2),var(--bg));z-index:0}
#bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 14s ease-in-out infinite}
#bg i:nth-child(1){width:360px;height:360px;background:#7c6cff;left:-80px;top:20%}
#bg i:nth-child(2){width:300px;height:300px;background:#38e8c6;right:-60px;top:5%;animation-delay:-5s}
#bg i:nth-child(3){width:340px;height:340px;background:#ff5d9d;right:25%;bottom:-140px;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-30px) scale(1.1)}}
.screen{position:fixed;inset:0;display:none;z-index:1;overflow:auto}
.screen.active{display:block}
#game.active{overflow:hidden}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer;background:#ffffff1c;box-shadow:0 4px 0 #0000004d;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0000004d}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.primary{background:linear-gradient(180deg,#4ff5d3,#16b89c);color:#06322b}
.btn.alt{background:linear-gradient(180deg,#8f82ff,#5a49e0)}
.btn.danger{background:linear-gradient(180deg,#ff7d8f,#e0405a)}
.btn.big{font-size:20px;padding:16px 26px;font-family:'Fredoka'}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff1c;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 #0000004d}
.icon:hover{filter:brightness(1.2)}.icon.on{background:linear-gradient(180deg,#4ff5d3,#16b89c)}.icon.off{background:linear-gradient(180deg,#ff7d8f,#e0405a)}
input[type=text],select{background:#0000004d;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;width:100%}
input[type=text]:focus,select:focus{border-color:var(--acc)}
select option{background:#1f1659}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.logo{font-family:'Fredoka';font-weight:700;font-size:22px;display:flex;gap:8px;align-items:center}
.grad{background:linear-gradient(90deg,#4ff5d3,#a99bff,#ff8fc8);-webkit-background-clip:text;background-clip:text;color:transparent}

.hero{max-width:600px;margin:0 auto;padding:0 18px 40px;text-align:center}
.globe{width:190px;height:190px;margin:0 auto;position:relative;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.globe svg{width:100%;height:100%;overflow:visible}
.pin{position:absolute;left:58%;top:-18px;font-size:44px;animation:drop 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0006)}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.hero h1{font-size:clamp(44px,9vw,68px);margin:10px 0 0;line-height:1}
.hero p.tag{color:var(--mut);font-size:18px;margin:10px auto 18px;max-width:440px}
.profile{display:grid;gap:12px;text-align:left}
.profile label{font-weight:800;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:#ffffff14;font-size:24px;cursor:pointer}
.avs button.sel{border-color:var(--acc);background:#38e8c622;transform:scale(1.08)}
.actions{display:grid;gap:12px;margin-top:16px}
.joinbox input{text-align:center;letter-spacing:.3em;font-weight:800;font-family:'Fredoka';text-transform:uppercase}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.features div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;font-size:13px;color:var(--mut)}
.features b{display:block;color:var(--txt);font-size:15px;margin:4px 0 2px;font-family:'Fredoka'}
.features span{font-size:26px}
.warn{margin-top:16px;background:#38e8c622;border:1px solid #38e8c688;color:#a9f5e8;padding:12px;border-radius:14px;font-size:14px;text-align:center}

.wrap{max-width:1000px;margin:0 auto;padding:0 18px 40px}
.lobGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:800px){.lobGrid{grid-template-columns:1fr}.features{grid-template-columns:1fr 1fr 1fr}}
.codeBox{text-align:center}
.code{font-family:'Fredoka';font-size:54px;letter-spacing:.18em;font-weight:700;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.plist{display:grid;gap:8px;margin-top:10px}
.pc{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#ffffff0f;border:2px solid transparent;transition:border-color .15s}
.pc .av,.pl .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--c);border:3px solid transparent;flex:none}
.pc b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag2{font-size:12px;padding:3px 8px;border-radius:99px;background:#ffffff1f;font-weight:800}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:10px}
.set label{font-weight:700;color:var(--mut)}
.muted{color:var(--mut);font-size:13px}

#panoBlock{position:absolute;inset:0;display:none;z-index:2}
#hudPlayers{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;width:min(290px,48vw);z-index:5}
.pl{display:flex;align-items:center;gap:8px;transition:opacity .3s}
.pl.dead{opacity:.45;filter:grayscale(.8)}.pl.off{opacity:.55}
.pl .av{width:38px;height:38px;font-size:20px;position:relative}
.pbar{flex:1;height:28px;border-radius:8px;background:#1c1546d9;border:2px solid #8f82ff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#8cf04e,#3fae21);transition:width 1s ease;z-index:0}
.pbar i.mid{background:linear-gradient(180deg,#ffd45a,#e08a12)}.pbar i.low{background:linear-gradient(180deg,#ff7d8f,#d12c47)}
.pbar *{position:relative;z-index:1}.pbar em{font-style:normal;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{width:22px;font-size:14px;text-align:center}
#hudCenter{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
#timer{font-family:'Fredoka';font-weight:700;font-size:26px;background:#150f3ee6;border:3px solid #8f82ff;border-radius:99px;padding:4px 22px;display:inline-block;min-width:110px}
#timer.urgent{background:#a3162dee;border-color:#ff7d8f;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#roundInfo{margin-top:6px;font-size:13px;font-weight:800;background:#150f3ecc;border-radius:99px;padding:3px 12px;display:inline-block}
#alertTxt{margin-top:6px;font-weight:800;color:#ffd58a;text-shadow:0 2px 4px #000;font-size:15px;min-height:20px}
#leftBtns{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
#guessWrap{position:absolute;right:14px;bottom:14px;z-index:6;width:300px;transition:width .2s,height .2s;display:flex;flex-direction:column;gap:8px}
#guessMapBox{height:200px;transition:height .2s;border-radius:14px;overflow:hidden;border:3px solid #8f82ff;position:relative;background:#7aa5e8;box-shadow:0 8px 24px #0008}
#guessMap{position:absolute;inset:0}
#guessWrap.s1,#guessWrap.s0.pinned,#guessWrap.s0:hover{width:520px}
#guessWrap.s1 #guessMapBox,#guessWrap.s0.pinned #guessMapBox,#guessWrap.s0:hover #guessMapBox{height:340px}
#guessWrap.s2{width:min(860px,calc(100vw - 28px))}#guessWrap.s2 #guessMapBox{height:min(540px,calc(100vh - 140px))}
.gbar{display:flex;gap:6px;position:absolute;left:6px;top:6px;z-index:1000}
.gbar button{width:30px;height:30px;border-radius:8px;border:0;background:#150f3ee6;color:#fff;font-size:14px;cursor:pointer}
#btnGuess{width:100%}
#spectOv{position:absolute;inset:auto;left:50%;bottom:18px;transform:translateX(-50%);background:#150f3ecc;border-radius:99px;padding:8px 20px;font-size:16px;z-index:5;display:none;font-family:'Fredoka'}
#resultOv{position:absolute;inset:0;z-index:9;display:none;background:#120d2e}
#resMap{position:absolute;inset:0}
#resPanel{position:absolute;right:14px;top:14px;bottom:14px;width:350px;background:#150f3ef2;border:2px solid #8f82ff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#resPanel h2{margin:0;font-size:24px}
.rrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px;border-radius:14px;background:#ffffff0f}
.rrow.win{background:#38e8c622;border:1px solid #38e8c688}
.rrow .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--c)}
.rrow .nm{display:flex;justify-content:space-between;font-weight:800;font-size:14px;gap:8px}
.rrow .nm em{font-style:normal;color:#ff9aa8}.rrow .nm u{text-decoration:none;color:var(--acc)}
.rrow .pbar{height:18px;margin-top:5px;font-size:11px;border-width:1px}
#nextIn{margin-top:auto;text-align:center;font-weight:800;color:var(--mut)}
@media(max-width:700px){#guessWrap{width:170px}#guessMapBox{height:130px}#guessWrap.s1,#guessWrap.s0.pinned,#guessWrap.s0:hover{width:calc(100vw - 28px)}#guessWrap.s1 #guessMapBox,#guessWrap.s0.pinned #guessMapBox,#guessWrap.s0:hover #guessMapBox{height:300px}
#resPanel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:46%}.icon{width:40px;height:40px}}

.podium{display:grid;gap:10px;margin:18px 0}
.fcard{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.fcard.first{background:linear-gradient(90deg,#ffb02e44,#ffffff11);border-color:#ffb02e}
.fcard .pos{font-family:'Fredoka';font-size:26px;width:38px}
.fcard .av{width:48px;height:48px;font-size:26px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.fcard .inf{flex:1;font-weight:800}.fcard .inf small{display:block;color:var(--mut);font-weight:600}

.modal{position:fixed;inset:0;background:#0009;z-index:50;display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.mbox{width:min(480px,100%);max-height:92vh;overflow:auto;background:#1b1450;border:2px solid #8f82ff;border-radius:22px;padding:20px}
.mbox h2{margin:0 0 10px}
.srow{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;margin:10px 0;font-weight:700}
.srow output{font-size:13px;color:var(--mut);text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:#ffffff10;font-weight:800;cursor:pointer}
.seg button.sel{border-color:var(--acc);background:#38e8c622}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-weight:700}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px;pointer-events:none;width:min(440px,92vw)}
.toast{background:#241a6cf2;border:1px solid #8f82ff;padding:10px 16px;border-radius:14px;font-weight:700;text-align:center;animation:ti .25s}
.toast.err{background:#7a1228f2;border-color:#ff7d8f}.toast.ok{background:#0d5c4ef2;border-color:var(--acc)}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}


/* ===== GEO.IO PIXEL THEME ===== */
:root{--ink:#04102b;--frame:#2b6fd6;--sky:#5ec0ff;--panel:#0d1a40;--panel2:#13275c;--gold:#ffca28;--gold2:#ff9f1a;--red:#ff5252;--txt:#eaf2ff;--mut:#8fa4d4;--acc:#5ec0ff;--bg:#060c1f;--line:#04102b;--good:#49a843}
*,*::before,*::after{border-radius:0!important}
html,body{font-family:'Nunito',sans-serif;font-size:17px;background:#060c1f;color:var(--txt);-webkit-font-smoothing:none}
h1,h2,h3,.fr,.code,#timer,.logo,.btn,.bdg,label,.tag2,#roundInfo,.pbar,.avEdit,.avTabs button{font-family:Fredoka,sans-serif}
#bg{background:linear-gradient(#050a1c 0 22%,#060d22 22% 44%,#08122b 44% 66%,#0a1634 66% 84%,#0b1a3d 84%)}
#bg i{display:none}
#bg::before{content:"";position:absolute;left:0;top:0;width:2px;height:2px;background:transparent;box-shadow:42vw 20vh 0 #ffffff,84vw 7vh 0 #ffffff,69vw 13vh 0 #8fb4ff,75vw 8vh 0 #5ec0ff,28vw 5vh 0 #ffffff,56vw 54vh 0 #ffffff,31vw 12vh 0 #5ec0ff,55vw 8vh 0 #5ec0ff,16vw 29vh 0 #5ec0ff,8vw 74vh 0 #5ec0ff,51vw 7vh 0 #8fb4ff,6vw 72vh 0 #8fb4ff,38vw 54vh 0 #8fb4ff,70vw 16vh 0 #5ec0ff,40vw 72vh 0 #8fb4ff,14vw 75vh 0 #5ec0ff,82vw 25vh 0 #8fb4ff,13vw 71vh 0 #ffffff,73vw 8vh 0 #5ec0ff,27vw 64vh 0 #5ec0ff,55vw 41vh 0 #ffffff,75vw 59vh 0 #8fb4ff,39vw 32vh 0 #8fb4ff,90vw 32vh 0 #ffffff,74vw 39vh 0 #5ec0ff,64vw 44vh 0 #ffffff,37vw 78vh 0 #ffffff,16vw 66vh 0 #ffffff,22vw 97vh 0 #8fb4ff,20vw 63vh 0 #ffffff,6vw 86vh 0 #ffffff,98vw 72vh 0 #5ec0ff,41vw 44vh 0 #8fb4ff,77vw 64vh 0 #5ec0ff,59vw 9vh 0 #ffffff,35vw 61vh 0 #ffffff,8vw 94vh 0 #8fb4ff,83vw 74vh 0 #ffffff,37vw 92vh 0 #ffffff,86vw 45vh 0 #ffffff,60vw 46vh 0 #8fb4ff,79vw 15vh 0 #ffffff,8vw 28vh 0 #8fb4ff,17vw 95vh 0 #8fb4ff,51vw 51vh 0 #ffffff,11vw 22vh 0 #ffffff;animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:.4}}
body.ingame::after{display:none}
.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.grad{background:none!important;color:var(--gold)!important;-webkit-text-fill-color:currentColor;text-shadow:3px 3px 0 var(--ink)}
.logo{font-size:20px;letter-spacing:.06em}
.btn{border:4px solid var(--ink);background:var(--frame);color:#fff;text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:700;padding:12px 18px;cursor:pointer;box-shadow:inset 0 4px 0 #ffffff40,inset 0 -4px 0 #00000045,0 4px 0 var(--ink);text-shadow:2px 2px 0 #0006}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 4px 0 #ffffff40,inset 0 -4px 0 #00000045}
.btn.primary{background:var(--gold);color:#3a2300;text-shadow:none}
.btn.alt{background:var(--frame)}.btn.danger{background:#d63a3a}
.btn.big{font-size:17px;padding:15px 20px}
.btn.live{background:#2f9e44}
.icon{width:44px;height:44px;border:4px solid var(--ink);background:var(--frame);font-size:0;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 3px 0 #ffffff40,inset 0 -3px 0 #00000045,0 3px 0 var(--ink)}
.icon.live{background:#2f9e44}
#btnLangQuick{font-size:13px!important}
input[type=text],select{background:#050b22;border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a;font-size:17px;color:#fff;padding:12px 14px;width:100%;outline:none}
input[type=text]:focus,select:focus{box-shadow:inset 0 0 0 2px var(--gold)}
select option{background:#050b22}
input[type=range]{accent-color:var(--gold)}
.card{background:var(--panel);border:4px solid #0a1a3a;box-shadow:0 0 0 4px var(--frame),0 10px 0 4px #07122b;padding:20px;margin:8px;backdrop-filter:none}
.card h3{margin:0 0 12px;font-size:14px;letter-spacing:.08em;color:var(--sky);text-transform:uppercase}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 40px}
.lobGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
@media(max-width:800px){.lobGrid{grid-template-columns:1fr}}
.code{color:var(--gold);text-shadow:4px 4px 0 var(--ink);font-size:48px}
.plist{display:grid;gap:10px;margin-top:6px}
.pc{display:flex;align-items:center;gap:12px;padding:8px;background:#0a1634;border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a}
.pc b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pc .bdg{margin-left:auto}
.tag2{background:var(--ink);color:var(--sky);padding:3px 8px;font-size:11px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:10px}
.set label{color:var(--mut);font-size:11px;text-transform:uppercase}
.muted{color:var(--mut);font-size:14px}
.pbar{background:#050b22;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a;font-size:12px}
.pbar i{background:var(--good)!important}.pbar i.mid{background:#e0a020!important}.pbar i.low{background:#d12c47!important}
#timer{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--sky);font-size:24px}
#timer.urgent{background:#a3162d;box-shadow:inset 0 0 0 3px #ff7d8f}
#roundInfo{background:var(--panel);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a;font-size:12px}
#guessMapBox{border:4px solid var(--ink);box-shadow:0 0 0 3px var(--sky),6px 6px 0 var(--ink)}
.gbar button{width:32px;height:32px;border:3px solid var(--ink);background:var(--panel);color:#fff;font-size:0;display:grid;place-items:center;cursor:pointer;padding:0}
#resPanel,.mbox{background:var(--panel);border:4px solid #0a1a3a;box-shadow:inset 0 0 0 3px #1d3a7a}
.rrow{background:#0a1634;border:3px solid var(--ink)}.rrow.win{background:#0f3558;border-color:var(--sky)}
.fcard{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a}.fcard.first{background:#3d2f08;box-shadow:inset 0 0 0 3px var(--gold)}
.seg button{border:4px solid var(--ink);background:#0a1634;color:#fff;font-weight:700;font-family:Fredoka,sans-serif;font-size:12px;cursor:pointer;padding:10px}
.seg button.sel{background:var(--frame)}
.toast{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px var(--sky)}.toast.err{box-shadow:inset 0 0 0 2px #ff7d8f}.toast.ok{box-shadow:inset 0 0 0 2px var(--good)}
.mk{width:26px;height:26px;border:3px solid #fff;box-shadow:3px 3px 0 var(--ink);font-size:0}
.mk.flag{background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/10px 10px!important}
.leaflet-container{font-family:'Nunito',monospace}
#spectOv{background:var(--panel);border:3px solid var(--ink)}
.bdg{display:inline-flex;height:28px;flex:none;--b:#5b6163;--bd:#26292a;--t:#e8f0e8}
.bdg .bi{width:28px;display:grid;place-items:center;background:var(--b);border:3px solid var(--bd);box-shadow:inset 0 0 0 2px #ffffff40,inset 0 -3px 0 #00000040}
.bdg .bt{padding:0 8px;display:flex;align-items:center;background:var(--b);border:3px solid var(--bd);border-left:0;box-shadow:inset 0 0 0 2px #ffffff30,inset 0 -3px 0 #00000040;color:var(--t);font-size:14px;font-weight:700;letter-spacing:.06em;text-shadow:2px 2px 0 #00000066}

.bdg.mini .bt{display:none}
/* ===== avatar (kare profil) ===== */
.avw{box-sizing:content-box;display:block;flex:none;width:64px;height:64px;border:3px solid var(--ink);background:#0b1a3d;image-rendering:pixelated;box-shadow:0 0 0 3px #1d3a7a;transition:box-shadow .08s}

.pc .avw,.rrow .avw,.fcard .avw,.pl .avw{width:64px;height:64px}
.rrow{grid-template-columns:70px 1fr}
.pl{gap:10px}

/* ===== ANA EKRAN ===== */
#home.active{display:flex;flex-direction:column}
.title{position:relative;z-index:2;flex:1;width:100%;max-width:400px;margin:0 auto;padding:0 18px clamp(96px,22vh,190px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,22px);text-align:center}
#logoCv{display:block;image-rendering:pixelated;max-width:100%;filter:drop-shadow(0 6px 0 #04102bcc)}
.title .tag{margin:0;max-width:290px;color:var(--mut);font-size:15px;line-height:1.3}
.who{display:grid;justify-items:center;gap:20px;width:100%;margin-top:4px}
.avSlot{position:relative;border:0;background:none;padding:0;cursor:pointer;line-height:0;color:inherit}
.avSlot .avw{width:128px;height:128px;border-width:4px;box-shadow:0 0 0 4px var(--frame),0 8px 0 4px #07122b}
.avSlot .avw.talk{box-shadow:0 0 0 4px #49e05a,0 8px 0 4px #07122b}
.avSlot:hover .avw,.avSlot:focus-visible .avw{box-shadow:0 0 0 4px var(--gold),0 8px 0 4px #07122b}
.avSlot:active{transform:translateY(3px)}
.avPen{position:absolute;right:-16px;bottom:-8px;width:38px;height:38px;display:grid;place-items:center;background:var(--gold);border:4px solid var(--ink);box-shadow:inset 0 3px 0 #fff7,inset 0 -3px 0 #0003,0 3px 0 var(--ink)}
.nameIn{text-align:center;font-size:20px!important;color:var(--gold)!important;letter-spacing:.04em}
.nameIn::placeholder{color:#5d77b5}
.menu{display:grid;gap:12px;width:100%}
.menu .btn{width:100%}
.menu .joinbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.menu .joinbox input{min-width:0;text-align:center;letter-spacing:.25em;font-family:Fredoka,sans-serif;text-transform:uppercase;font-size:15px}
.menu .joinbox .btn{width:auto}
#land{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(80px,20vh,180px);image-rendering:pixelated;z-index:1;pointer-events:none}
@media(max-height:720px){.avSlot .avw{width:96px;height:96px}.who{gap:16px}}

/* ===== MANTI STÜDYOSU + AMİRAL BATTI ===== */
.modal{grid-template-columns:minmax(0,1fr)}
#avEd{z-index:60}
#avEd .avbox{width:min(440px,100%);justify-self:center}
#avPrev{width:160px;height:160px;image-rendering:pixelated;display:block;margin:6px auto 12px;background:#0b1a3d;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--sky)}
#avEd .lb{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-top:8px}
.avSw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.avSw button{height:34px;border:3px solid var(--ink);cursor:pointer;padding:0}
.avSw button.on{outline:3px solid var(--gold);outline-offset:1px}
.avStep{display:flex;align-items:center;gap:8px;margin:8px 0}
.avStep .lb{flex:0 0 74px;margin:0}
.avStep b{flex:1;text-align:center;font-size:13px}
.avStep .btn{padding:6px 14px;font-size:18px}
.avTg.on{background:var(--gold);color:#3a2300}
.lobName{flex:1;min-width:0;padding:6px 8px!important;font-size:14px!important}
.pc .rm{padding:4px 10px;font-size:13px}
#bs .wrap{max-width:640px;padding-bottom:30px}
.bsChips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px}
.bsChip{flex:none;display:grid;justify-items:center;gap:2px;padding:6px;border:3px solid var(--ink);background:var(--panel);font-size:11px;cursor:pointer;min-width:62px;max-width:84px}
.bsChip .avw{width:40px;height:40px;border-width:2px;box-shadow:none}
.bsChip b{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsChip span{color:var(--gold);font-size:9px;letter-spacing:1px;height:11px}
.bsChip.turn{border-color:var(--gold)}
.bsChip.sel{box-shadow:0 0 0 3px var(--sky)}
.bsChip.dead{opacity:.35;filter:grayscale(1)}
.bsMsg{min-height:44px;text-align:center;font-family:Fredoka,sans-serif;font-size:13px;line-height:1.35;color:var(--gold);padding:4px 6px 10px;text-shadow:2px 2px 0 var(--ink)}
canvas.bsBoard{width:min(100%,560px);aspect-ratio:1;display:block;margin:0 auto;image-rendering:pixelated;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--frame);touch-action:manipulation;background:#0a1a3d}
#bsMiniBox{display:none;gap:12px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
canvas#bsMine{width:min(60vw,240px)}
#bsTray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.bsBreak{flex-basis:100%;height:0}
.bsShip{font-size:12px;padding:8px 10px}
.bsShip.on{background:var(--gold);color:#3a2300}
.bsShip.done{opacity:.55}
.bsCover,.bsEnd{position:fixed;inset:0;z-index:70;background:#030a1ef5;display:none;place-items:center;text-align:center;padding:20px}
.bsCover.on,.bsEnd.on{display:grid}
.avw.bsBig{width:128px;height:128px;margin:0 auto;border-width:4px}

/* ===== MOD KARTLARI + SESLİ SOHBET + AMİRAL REHBERİ ===== */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.modes.sm{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{display:grid;gap:6px;align-content:start;text-align:left;padding:6px;border:4px solid var(--ink);background:#0a1634;color:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px #1d3a7a,0 4px 0 var(--ink);font-family:Fredoka,sans-serif;transition:transform .08s}
.mcard:hover{filter:brightness(1.15)}
.mcard:active{transform:translateY(3px)}
.mcard canvas.thm{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;border:3px solid var(--ink);background:#0b1a3d}
.mcard b{font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:2px 2px 0}
.mcard small{font-family:'Nunito',sans-serif;font-size:13px;line-height:1.2;color:var(--mut);padding:0 2px 2px;min-height:2.4em}
.mcard.sel{background:#3d2f08;box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 var(--ink)}
.mcard.sel b{color:var(--gold)}
.mcard.sel canvas.thm{border-color:var(--gold)}
.modes.sm .mcard b{font-size:11px;text-align:center}
.modes.sm .mcard small{display:none}
.subT{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-top:12px;font-family:Fredoka,sans-serif}
.vbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.vp{display:flex;align-items:center;gap:8px;min-width:0;background:#0d1a40d9;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a;padding:3px 10px 3px 3px;pointer-events:none}
.vp .avw{width:44px;height:44px}
.vp b{font-family:Fredoka,sans-serif;font-size:11px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hudPlayers{max-height:calc(100vh - 190px);overflow:hidden}
#hudPlayers .vp{margin-top:2px}
.bsHint{min-height:34px;text-align:center;font-size:14px;line-height:1.25;color:#cfe3ff;padding:0 6px 8px}
.bsLbl{font-family:Fredoka,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);text-align:center;margin:2px 0 8px}
.bsFleet{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}
.bsF{display:inline-flex;align-items:center;gap:3px;font-family:Fredoka,sans-serif;font-size:10px;padding:4px 6px;border:3px solid var(--ink);background:var(--panel)}
.bsF em{font-style:normal;margin-right:4px;color:var(--mut)}
.bsF i{width:9px;height:9px;background:#6b7a99;border:1px solid var(--ink);display:block}
.bsF i.h{background:#ff5252}
.bsF.sunk{border-color:#ff5252}
.bsF.sunk i{background:#ff5252}
.bsF.sunk em{text-decoration:line-through;color:#ff9aa8}
.hlp p{margin:8px 0;font-size:15px;line-height:1.3}

/* ===== AMİRAL BATTI: solda kontroller, sağda büyük deniz ===== */
#bs{overflow:hidden}#bs.active{display:flex;flex-direction:column;height:100dvh}
#bs .top{padding:6px 14px;flex:none}#bs .logo{font-size:18px}
#bs .wrap{flex:1;min-height:0;width:100%;max-width:none;padding:0 14px 12px;display:flex;gap:16px}
#bsL{flex:0 0 min(330px,38vw);min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}#bsL>*{flex:none}
#bsR{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
canvas#bsMain{width:min(100%,calc(100dvh - 84px));height:auto;aspect-ratio:1;max-width:100%}
.bsChips{flex-direction:column;overflow:visible;padding:0;gap:6px}
.bsChip{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:none;min-width:0;padding:5px 10px}
.bsChip .avw{width:34px;height:34px;flex:none}.bsChip b{flex:1;max-width:none;text-align:left;font-size:13px}.bsChip span{position:static;height:auto}
.bsMsg{min-height:46px;text-align:left;padding:6px 8px;font-size:12px;background:#0a1634d9;border:3px solid var(--ink)}.bsHint{min-height:0;text-align:left;font-size:13px;padding:0 2px}
#bsL .bsLbl{text-align:left;margin:2px 0 0}.bsFleet{justify-content:flex-start;margin:0}.bsF{padding:2px 5px}
#bsTray{justify-content:flex-start;margin:0;gap:6px}.bsShip{padding:6px 8px;font-size:11px}
#bsMiniBox{margin:0;justify-content:flex-start}canvas#bsMine{width:min(100%,150px)}
.bsA{display:inline-block;padding:1px 8px;border:3px solid var(--ink);background:var(--c);color:#fff;text-shadow:2px 2px 0 #000;margin:0 2px}
.bsChip.atk{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f}.bsChip.tgt{border-color:#ff5252;box-shadow:0 0 0 3px #ff5252}
.bsChip.atk::after,.bsChip.tgt::after{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:10px Fredoka,sans-serif;padding:2px 5px;background:#000;color:#ffd23f}
.bsChip.atk::after{content:'ATAR'}.bsChip.tgt::after{content:'HEDEF';color:#ff7b7b}
@media (max-aspect-ratio:1/1){#bsR{justify-content:center}#bs .wrap{flex-direction:column;gap:6px}#bsL{flex:none;max-height:44%}#bsR{flex:1}canvas#bsMain{width:min(100%,calc(56dvh - 40px))}.bsChips{flex-direction:row;overflow-x:auto;flex-wrap:nowrap}.bsChip{width:auto;flex:none;padding:3px 6px}.bsChip b{font-size:11px}.bsChip.atk::after,.bsChip.tgt::after{top:-9px;right:auto;left:50%;transform:translateX(-50%)}}
/* ===== VAMPİR KÖYLÜ ===== */
#vk{overflow:hidden;background:#58ab37}#vkCv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#vk{--p:#f6efd6;--b:#3a2615;font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--b)}
#vkTop{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:flex-start;gap:8px;z-index:3;pointer-events:none}
#vkTop>*{pointer-events:auto}#vkRoles{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.vkRc{position:relative;display:grid;place-items:center;width:34px;height:34px;background:var(--p);border:3px solid var(--b);border-radius:9px;box-shadow:0 3px 0 #0003}
.vkRc.me{border-color:var(--t);box-shadow:0 0 0 3px var(--t)}.vkRc i{position:absolute;right:-5px;bottom:-6px;font:800 11px Nunito,sans-serif;background:var(--b);color:#fff;border-radius:8px;padding:0 5px;font-style:normal}
#vkPill{display:flex;align-items:center;gap:6px;background:var(--p);border:3px solid var(--b);border-radius:14px;padding:4px 12px;font-size:15px;box-shadow:0 3px 0 #0003}#vkTm{min-width:20px;text-align:right;color:#c0392b}
.vkBtns{display:flex;gap:6px;flex:1;justify-content:flex-end}.vkb{width:36px;height:36px;display:grid;place-items:center;background:var(--p);border:3px solid var(--b);border-radius:10px;cursor:pointer;box-shadow:0 3px 0 #0003;padding:0}.vkb.d{background:#d9453d}.vkb.live{background:#9be15d}
#vkMe{position:absolute;top:56px;left:8px;z-index:3;display:grid;gap:4px;max-width:46vw}.vkMeC{display:flex;align-items:center;gap:6px;background:var(--p);border:3px solid var(--t);border-radius:12px;padding:4px 10px;font-size:15px;box-shadow:0 3px 0 #0003}
.vkSub{background:#f6efd6e6;border:2px solid var(--b);border-radius:8px;padding:2px 8px;font-size:12px}
#vkMsg{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:3;max-width:min(520px,calc(100vw - 190px));text-align:center;font-size:14px;line-height:1.25;background:var(--p);border:3px solid var(--b);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 #0003;pointer-events:none}#vkMsg:empty{display:none}
#vkLog{position:absolute;top:56px;right:8px;width:min(230px,70vw);max-height:calc(100% - 150px);overflow-y:auto;background:var(--p);border:3px solid var(--b);border-radius:12px;padding:6px;z-index:4;display:none;box-shadow:0 3px 0 #0003}
#vkLog.show{display:block}@media (min-width:900px){#vkLog{display:block}#vkLogBtn{display:none}}
#vkLog .lg{display:flex;gap:6px;align-items:flex-start;border-bottom:2px dashed #3a261533;padding:5px 2px;font-size:12px;line-height:1.2}#vkLog .lg:last-child{border:0}#vkLog .ic{flex:none;margin-top:1px}
#vkBar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;text-align:center;background:var(--p);border:3px solid var(--b);border-radius:14px;padding:8px 16px;font-size:15px;box-shadow:0 3px 0 #0003;max-width:calc(100vw - 20px)}
#vkBar .btn{padding:4px 12px;font-size:13px;margin-left:6px}
.ic{vertical-align:middle;flex:none}

/* ===== SADE TEMA (parlama yok, düz renk) ===== */
:root{--ink:#1d1a40;--frame:#4a4590;--panel:#35317a;--panel2:#2b2862;--card2:#2a2759;--light:#ece8fb;--lightsh:#b3aadf;--sky:#b9b2f0;--gold:#e8b94a;--acc:#6cc7a8;--good:#4fa86f;--red:#d9484b;--txt:#f1eefc;--mut:#a9a3d6;--bg:#2e2a63;--line:#1d1a40}
html,body{background:#2e2a63;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px;-webkit-font-smoothing:auto}
h1,h2,h3,.fr,.code,#timer,.logo,.btn,.bdg,label,.tag2,#roundInfo,.pbar,.avEdit,.avTabs button{font-family:'Fredoka','Nunito',sans-serif;letter-spacing:.02em;text-transform:none}
#bg{background:#2e2a63}#bg::before,#bg i{display:none!important}
.grad,.code{color:#fff!important;text-shadow:none!important}
.logo{font-size:22px}
.btn{background:var(--light);color:#2b2457;border:0;font-size:16px;text-transform:none;text-shadow:none;padding:12px 20px;box-shadow:0 4px 0 var(--lightsh)}
.btn:hover{filter:none;background:#fff}.btn:active{transform:translateY(4px);box-shadow:none}
.btn.primary{background:var(--acc);color:#10372c;box-shadow:0 4px 0 #3d9279}.btn.alt{background:var(--light);color:#2b2457}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 #9c2e31}.btn.live{background:var(--good);color:#fff;box-shadow:0 4px 0 #357a4f}
.icon,.gbar button,.vkb{background:var(--light);color:#2b2457;border:0;box-shadow:0 3px 0 var(--lightsh)}
.icon.live{background:var(--good)}
input[type=text],select{background:var(--card2);border:3px solid #1d1a40;box-shadow:none;color:#fff}
input[type=text]:focus,select:focus{border-color:var(--acc);box-shadow:none}
.card,#resPanel,.mbox{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}
.card h3{color:#fff;font-size:15px;text-transform:none}
.pc,.rrow,.fcard,.vp,.mcard{background:var(--card2);border:3px solid #1d1a40;box-shadow:none}
.mcard{color:#fff;font-family:'Fredoka',sans-serif}.mcard.sel,.fcard.first,.rrow.win{background:#3d3a85;border-color:var(--acc);box-shadow:none}
.tag2{background:#1d1a40;color:#d8d3f5}
.pbar{background:var(--card2);border:3px solid #1d1a40;box-shadow:none}
#timer,#roundInfo{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}#timer.urgent{background:var(--red)}
.toast,.toast.err,.toast.ok{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}.toast.err{border-color:var(--red)}.toast.ok{border-color:var(--acc)}
.seg button{background:var(--card2);border:3px solid #1d1a40;font-family:'Fredoka',sans-serif;text-transform:none}.seg button.sel{border-color:var(--acc);background:#3d3a85}
.avw,#avPrev,.avSlot .avw{background:#2a2759;border:3px solid #1d1a40;box-shadow:none}
.avw.talk,.avSlot .avw.talk{border-color:var(--good);box-shadow:none}.avSlot:hover .avw{border-color:var(--acc);box-shadow:none}
#guessMapBox,canvas.bsBoard{border:3px solid #1d1a40;box-shadow:none}
.bsChip.sel{box-shadow:none;outline:3px solid #fff}.bsChip.atk,.bsChip.tgt{box-shadow:none}
.warn{background:var(--card2);border:3px solid #1d1a40;color:var(--txt)}
/* vampir köylü HUD */
#vk{--p:#f3ecd4;--b:#2e2418}
.vkRc,.vkb,#vkPill,#vkMsg,#vkBar,#vkLog,.vkMeC{border-width:3px;box-shadow:none}
.vkRc.me{box-shadow:none;outline:3px solid var(--t)}
#vkPill{padding:4px 14px;gap:8px;min-width:96px;justify-content:center}
#vkPill #vkPh{font:600 15px Fredoka,sans-serif}
#vkTm{font:700 22px Fredoka,sans-serif;color:#2e2418;min-width:26px;text-align:center}
#vkTm.low{color:#c0392b}

/* ===== kenarlıksız, yumuşak köşeli ===== */
*,*::before,*::after{border-radius:12px!important;border-color:transparent!important;box-shadow:none!important;text-shadow:none!important;outline:0!important}
html,body,.screen,#bg,#panoHost,#pano,#pano *,#vkCv,#game,#panoBlock,.leaflet-container,.leaflet-container *,.leaflet-tile,#vk{border-radius:0!important}
.mk,.avw,.vkMeC i{border-radius:50%!important}.avw{border-radius:14px!important}
#panoHost:not(.on){opacity:0!important;pointer-events:none!important}
body:not(.ingame) #panoHost{opacity:0!important;pointer-events:none!important}
input[type=text]:focus,select:focus{background:#3a3678}
.vkRc.me,.bsChip.sel{background:#fff!important;color:#2b2457}
.avw.talk{background:#2f6b4c}
.btn,.icon,.vkb{box-shadow:none!important}
.btn:hover,.icon:hover{filter:brightness(.95)}
#vkMe,#vkMsg,#vkLog,#vkLogBtn{display:none!important}

/* ===== YENİ OYUNLAR + YATAY ===== */
.title .tag,.mcard small{display:none!important}
.modes{grid-template-columns:repeat(3,1fr)}
.mcard b{text-align:center}
#xg.active{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:#2e2a63}
#xgTop{position:absolute;top:6px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
#xgTop>*{pointer-events:auto}#xgTop .logo{font-size:16px;opacity:.8}#xgTop .btn{padding:6px 10px}
#xgRoot{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:44px 12px 10px}
.xpx{image-rendering:pixelated}
.wIn{display:grid;gap:12px;justify-items:center;width:min(560px,100%)}
.wBadge{background:var(--c);color:#fff;font:700 clamp(20px,5vh,34px) Fredoka,sans-serif;padding:8px 24px}
.wWho{font:600 18px Fredoka,sans-serif;color:#fff}
.wChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.wChip{padding:8px 14px;font-size:14px}

<script>
"use strict";

/* ======================================================================
   API-SIZ TAM ÇALIŞAN YAPILANDIRMA VE HARİTA CDN'LERİ
   ====================================================================== */
const CONFIG = {
  PITCH: 0,
  // İSTEĞE BAĞLI: Google Maps API anahtarı. Yazarsan: yol isimleri, pusula, butonlar tamamen kapanır, bina içi/boş yerler otomatik atlanır. Boşsa eski gömme (iframe) yöntemi çalışır.
  GOOGLE_MAPS_KEY: '',
  GUESS_COUNTDOWN_MS: 15000,
  RESULT_MS: 10000,
  NO_GUESS_KM: 15000,
  // CartoDB Voyager CDN: 403 engeli bulunmayan hızlı, kaliteli harita sunucusu
  MAP_TILE_URL: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'
};

/* Google Street View'i API Anahtarı Olmadan Dinamik Yükleyen Sistem */
function getStreetViewEmbedUrl(lat, lng) {
  return `https://www.google.com/maps?layer=c&cbll=${lat},${lng}&cbp=12,0,0,0,${CONFIG.PITCH}&hl=${ST.lang}&source=embed&output=svembed`;
}

let GM_OK = false, gmPromise = null;
function loadGoogle() {
  if (!CONFIG.GOOGLE_MAPS_KEY) return Promise.resolve(false);
  if (gmPromise) return gmPromise;
  gmPromise = new Promise(res => {
    window.gm_authFailure = () => { GM_OK = false; };
    window.__gmReady = () => { GM_OK = true; res(true); };
    const sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(CONFIG.GOOGLE_MAPS_KEY) + '&callback=__gmReady';
    sc.onerror = () => res(false);
    document.head.appendChild(sc);
    setTimeout(() => res(GM_OK), 10000);
  });
  return gmPromise;
}
/* Anahtar varsa: gerçekten dış mekan Google Street View'i olan nokta bulunana kadar sessizce dener. */
async function pickLocation(region) {
  await loadGoogle();
  if (!GM_OK) return getRandomLocation(region);
  const svc = new google.maps.StreetViewService();
  for (let i = 0; i < 12; i++) {
    const c = getRandomLocation(region, true);
    const d = await new Promise(res => {
      const to = setTimeout(() => res(null), 3500);
      svc.getPanorama({ location: { lat: c.lat, lng: c.lng }, radius: 20000, preference: google.maps.StreetViewPreference.NEAREST, source: google.maps.StreetViewSource.OUTDOOR },
        (data, st) => { clearTimeout(to); res(st === 'OK' && data && data.location && /google/i.test(data.copyright || '') ? data : null); });
    });
    if (d) { const ll = d.location.latLng; return { lat: +ll.lat().toFixed(6), lng: +ll.lng().toFixed(6), pano: d.location.pano }; }
  }
  return getRandomLocation(region);
}
/* Arka planda gizli iframe olarak önceden yükler */
function makeFrame(loc) {
  if (GM_OK && loc.pano) {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;inset:0;visibility:hidden';
    $('#panoHost').appendChild(d);
    const p = new google.maps.StreetViewPanorama(d, { pano: loc.pano, pov: { heading: Math.floor(Math.random() * 360), pitch: 0 }, zoom: 0,
      addressControl: false, fullscreenControl: false, motionTracking: false, motionTrackingControl: false, enableCloseButton: false,
      showRoadLabels: false, zoomControl: false, panControl: false, linksControl: true, clickToGo: true, visible: true });
    d.loadP = new Promise(res => { google.maps.event.addListenerOnce(p, 'status_changed', () => setTimeout(() => res(true), 600)); setTimeout(() => res(true), 3000); });
    return d;
  }
  const f = document.createElement('iframe');
  f.allow = 'fullscreen';
  f.style.cssText = 'position:absolute;left:0;top:-72px;width:calc(100% + 72px);height:calc(100% + 72px);border:0;visibility:hidden';
  f.loadP = new Promise(res => { f.onload = () => res(true); setTimeout(() => res(false), 6000); });
  f.src = getStreetViewEmbedUrl(loc.lat, loc.lng);
  $('#panoHost').appendChild(f);
  return f;
}
function prefetch(region) {
  S.pre = { region, p: pickLocation(region).then(loc => ({ loc, frame: makeFrame(loc) })) };
}
async function takeLocation(region) {
  if (!S.pre || S.pre.region !== region) {
    if (S.pre) S.pre.p.then(x => x.frame.remove());
    prefetch(region);
  }
  const pre = S.pre; S.pre = null;
  return pre.p;
}

/* ===== ÇİN MANTISI KARAKTERİ (eski avatar sistemi kaldırıldı) ===== */
const AV = (() => {
const COLS=['#a98be0','#dcae45','#4fb0be','#cf5560','#e58fb0','#7cc79a','#5b8bd9','#e6e2f0','#e5903f','#a4c955','#6f6a8a','#efc3a3'];
const COLN=[['Mor','Purple'],['Altın','Gold'],['Turkuaz','Teal'],['Kırmızı','Red'],['Pembe','Pink'],['Nane','Mint'],['Mavi','Blue'],['İnci','Pearl'],['Turuncu','Orange'],['Limon','Lime'],['Susam','Sesame'],['Şeftali','Peach']];


const FACEN=[['Gülümseme','Smile'],['Mutlu ^^','Happy ^^'],['Şaşkın','Wow'],['Göz kırpan','Wink'],['Uykulu','Sleepy'],['Kedi','Cat'],['Kararlı','Determined'],['Üzgün','Sad']];
const ACCN=[['Yok','None'],['Bambu kapak','Bamboo lid'],['Fiyonk','Bow'],['Taç','Crown'],['Yuvarlak gözlük','Round glasses'],['Güneş gözlüğü','Sunglasses'],['Parti şapkası','Party hat'],['Kedi kulağı','Cat ears'],['Bandana','Headband'],['Filiz','Sprout'],['Hale','Halo'],['Çubuklar','Chopsticks'],['Bıyık','Mustache'],['Çiçek','Flower']];
const HW={7:2,8:4,9:6,10:7,11:9,12:10,13:10,14:11,15:11,16:11,17:11,18:11,19:11,20:10,21:9};
const shc={};
const sh=(h,a)=>{const k=h+a;if(shc[k])return shc[k];const n=parseInt(h.slice(1),16);return shc[k]='#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,v+a)).toString(16).padStart(2,'0')).join('')};
const hs=(x,y,f)=>{let n=Math.imul(x+1,374761393)^Math.imul(y+1,668265263)^Math.imul(f+1,2147483647);n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296};
const ln=(x0,y0,x1,y1,f)=>{const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}};
const defaults=()=>({v:2,c:0,f:0,a:0,b:1,g:1});
const fix=d=>{if(!d||d.v!==2)return defaults();const m=(v,n)=>Math.abs(v|0)%n;return{v:2,c:m(d.c,COLS.length),f:m(d.f,FACEN.length),a:m(d.a,ACCN.length),b:d.b?1:0,g:d.g?1:0}};
const rn=n=>Math.random()*n|0;
const randomize=()=>({v:2,c:rn(COLS.length),f:rn(FACEN.length),a:rn(ACCN.length),b:Math.random()<.7?1:0,g:Math.random()<.7?1:0});
const lang=()=>(typeof ST!=='undefined'&&ST.lang==='en')?1:0;

function paintBust(cv,data,t,talk){
  const d=fix(data),x=cv.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,32,32);x.setTransform(1,0,0,1,0,5);
  const P=(px,py,c)=>{x.fillStyle=c;x.fillRect(px,py,1,1)};
  const R=(px,py,w,h,c)=>{x.fillStyle=c;x.fillRect(px,py,w,h)};
  const M=(px,py,c)=>{P(px,py,c);P(31-px,py,c)};
  const base=COLS[d.c],out=sh(base,-85),lite=sh(base,38),dark=sh(base,-32),dark2=sh(base,-48),pleat=sh(base,-46);
  const bl=(t%4)<.12,sl=Math.sin(t*.8),lk=sl>.7?1:sl<-.7?-1:0,fr=(t*2|0)%4;
  const dk='#2b1d1d',wh='#fff';
  const inD=(px,py)=>{const h=HW[py];return h!==undefined&&px>=16-h&&px<16+h};

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

  return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
}

const A = { ctx: null, master: null };
function ensureAudio() {
  if (!A.ctx) {
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.master = A.ctx.createGain(); A.master.connect(A.ctx.destination);
  }
  if (A.ctx.state === 'suspended') A.ctx.resume();
}
function tone(f, d, type = 'sine', vol = .2) {
  if (!A.ctx || !ST.sfxOn) return;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol * ST.master, A.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, A.ctx.currentTime + d);
  o.connect(g); g.connect(A.master); o.start(); o.stop(A.ctx.currentTime + d);
}
function sfx(n) {
  ensureAudio();
  if (n === 'click') tone(600, .05, 'triangle');
  if (n === 'start') tone(520, .15, 'sine');
  if (n === 'win') tone(880, .3, 'sine');
  if (n === 'lose') tone(220, .3, 'sawtooth');
}

/* Kötü konum hafızası: 🔄'e bastığın (iç mekan/boş) yerler bu cihazda saklanır ve bir daha çıkmaz. */
const bkey = (la, ln) => (+la).toFixed(5) + ',' + (+ln).toFixed(5);
function badSet() { try { return new Set(JSON.parse(localStorage.getItem('bad_locs') || '[]')); } catch (e) { return new Set(); } }
function addBad(la, ln) { try { const b = badSet(); b.add(bkey(la, ln)); localStorage.setItem('bad_locs', JSON.stringify([...b])); } catch (e) {} }

function getRandomLocation(region, wide) {
  const f = REGIONS[region] || null; const bad = badSet(); let pool = CITIES.filter(c => (!f || f.includes(c[0])) && !bad.has(bkey(c[1], c[2])));
  if (!pool.length) pool = CITIES.filter(c => !f || f.includes(c[0]));
  const c = pool[Math.floor(Math.random() * pool.length)];
  const span = wide ? 0.3 : 0;
  const j = () => (Math.random() - 0.5) * span;
  return { lat: +(c[1] + j()).toFixed(5), lng: +(c[2] + j()).toFixed(5) };
}

/* ---- avatar widget'ları + mikrofon ---- */
const VOICE = { on: false, talk: 0, lvl: 0, ctx: null, an: null, buf: null, stream: null };
AV.setMicSource(() => VOICE.talk);
const avCanvas = pid => `<canvas class="avw" data-pid="${pid}" width="32" height="32"></canvas>`;
function avDataOf(pid) {
  if (pid === 'me' || pid === UID) return ST.avData && ST.avData.v === 2 ? ST.avData : AV.defaults();
  const p = S.players && S.players[pid]; return (p && p.av) || AV.defaults();
}
/* ses seviyesi ölçer: mikrofon ve uzak oyuncular için ortak (0=sessiz … 3=yüksek) */
function vuStep(o) {
  o.an.getByteTimeDomainData(o.buf);
  let sum = 0; for (const v of o.buf) { const d = (v - 128) / 128; sum += d * d; }
  const r = Math.sqrt(sum / o.buf.length), now = performance.now(), prev = o.lvl || 0;
  o.lvl = r > prev ? prev * .3 + r * .7 : prev * .65 + r * .35;
  o.pk = Math.max(.06, (o.pk || .06) * .995, o.lvl);
  const l = o.lvl, q = l / o.pk;
  let tk = l < .012 ? 0 : q < .3 ? 1 : q < .6 ? 2 : 3;
  if (tk > 0) o.hold = now + 280; else if (now < (o.hold || 0)) tk = 1;   // rozet titremesin
  return tk;
}
function micPoll() {
  if (!VOICE.on) { VOICE.talk = 0; VOICE.lvl = 0; return; }
  VOICE.talk = vuStep(VOICE);
}
function avTick() {
  micPoll(); netPoll();
  const t = performance.now() / 1000, bl = (t % 4) < .12 ? 1 : 0, sl = Math.sin(t * .8), lk = sl > .7 ? 1 : sl < -.7 ? -1 : 0;
  $$('canvas.avw').forEach(cv => {
    if (!cv.offsetParent) return;
    const pid = cv.dataset.pid, mine = pid === 'me' || pid === UID, data = avDataOf(pid), p = S.players && S.players[pid];
    const tk = mine ? VOICE.talk : ((p && p.talk) | 0);
    cv.classList.toggle('talk', tk > 0);
    const k = tk + '|' + bl + '|' + lk + '|' + (((t * 2) | 0) % 4);
    if (cv._k === k && cv._data === data) return;
    cv._k = k; cv._data = data; AV.paintBust(cv, data, t, tk);
  });
}
function avRepaintAll() { $$('canvas.avw').forEach(c => { c._k = null; }); avTick(); }
function micUI() { ['#btnMic', '#btnMicG', '#btnMicB', '#btnMicV'].forEach(id => { const b = $(id); if (b) b.classList.toggle('live', VOICE.on); }); }
async function micToggle() {
  if (VOICE.on) {
    VOICE.stream.getTracks().forEach(x => x.stop()); try { VOICE.ctx.close(); } catch (e) {}
    VOICE.on = false; VOICE.talk = 0; hangAll(); netSend({ t: 'mic', id: UID, on: false }); micUI(); return;
  }
  try {
    VOICE.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    VOICE.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = VOICE.ctx.createMediaStreamSource(VOICE.stream);

}

async function netHost(tries = 0) {
  netTeardown();
  if (!await loadPeerJS()) { toast(Lg('Sesli sohbet sunucusuna ulaşılamadı, oda yerel çalışıyor', 'Voice server unreachable, room runs locally'), 'err', 4500); return; }
  if (S.screen === 'home' || !S.code) return;
  const code = S.code, peer = new Peer('geoio-' + code);
  NET.peer = peer; NET.host = true; NET.code = code; NET.on = true;
  peer.on('open', id => { NET.pid = id; if (S.players[UID]) S.players[UID].pid = id; });
  peer.on('connection', c => { c.on('data', d => netHostData(c, d)); c.on('close', () => netDrop(c)); c.on('error', () => netDrop(c)); });
  peer.on('call', netOnCall);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && tries < 4) { S.code = Math.random().toString(36).substring(2, 7).toUpperCase(); renderLobby(); netHost(tries + 1); }
    else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible'].includes(e.type)) toast(Lg('Sesli sohbet bağlantı hatası: ', 'Voice connection error: ') + e.type, 'err', 4000);
  });
}
function netDrop(c) {

}
function netHostData(c, d) {
  if (!d || !d.t) return;
  if (d.t === 'hello') {
    const uid = String(d.uid || '').slice(0, 24), n = Object.keys(S.players).length;
    if (!uid) return;
    if (n >= S.meta.max && !S.players[uid]) { c.send({ t: 'full' }); setTimeout(() => { try { c.close(); } catch (e) {} }, 300); return; }
    const p = { id: uid, name: String(d.name || '?').slice(0, 14), av: AV.fix(d.av), color: PALETTE[n % 8], pid: c.peer, hp: S.meta.hp, remote: true };
    c._uid = uid; NET.conns[uid] = c; S.players[uid] = p;
    c.send({ t: 'state', max: S.meta.max, players: Object.values(S.players).map(pub) });
    netSend({ t: 'join', p: pub(p) }, c);
    netChanged(); toast(Lg(`${p.name} katıldı`, `${p.name} joined`), 'ok');

}

async function netJoin(code) {
  const name = getName(); if (!name) return;
  code = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  netTeardown(); purgeRemote();
  toast(Lg('Odaya bağlanılıyor…', 'Connecting…'));
  if (!await loadPeerJS()) { toast(Lg('Bağlantı kütüphanesi yüklenemedi (internet?)', 'Could not load connection library'), 'err', 4500); return; }
  const peer = new Peer('geoio-' + code + '-' + UID.slice(2));
  NET.peer = peer; NET.code = code; NET.on = true; NET.host = false; NET.joined = false;
  const fail = msg => { if (NET.peer !== peer) return; netTeardown(); toast(msg, 'err', 4000); };
  NET.jt = setTimeout(() => { if (!NET.joined) fail(t('roomNotFound')); }, 12000);
  peer.on('open', id => {
    NET.pid = id;
    const c = peer.connect('geoio-' + code, { reliable: true }); NET.hostConn = c;
    c.on('open', () => c.send({ t: 'hello', uid: UID, name, av: ST.avData, pid: id }));
    c.on('data', netJoinerData);
    c.on('close', () => { if (NET.peer === peer && NET.joined) hostGone(); });
  });
  peer.on('call', netOnCall);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => { if (!NET.joined) fail(e.type === 'peer-unavailable' ? t('roomNotFound') : Lg('Bağlantı hatası: ', 'Connection error: ') + e.type); });
}
function netJoinerData(d) {
  if (!d || !d.t) return;
  if (d.t === 'state') {
    NET.joined = true; clearTimeout(NET.jt);
    S.code = NET.code;
    S.meta = { max: d.max || 10, hp: 6000, mode: 'move', limit: 60, region: 'world', game: 'geo' };
    S.players = {};
    d.players.forEach(p => { S.players[p.id] = Object.assign({ hp: S.meta.hp }, p, { remote: p.id !== UID }); });
    if (S.players[UID]) { S.players[UID].av = ST.avData || S.players[UID].av; S.players[UID].pid = NET.pid; }
    renderLobby(); show('lobby'); prefetch(S.meta.region);
    toast(Lg('Odaya katıldın! Mikrofonu açabilirsin.', 'Joined! You can turn the mic on.'), 'ok');
    if (VOICE.on) callAll();
  } else if (d.t === 'join') {
    S.players[d.p.id] = Object.assign({ hp: S.meta.hp }, d.p, { remote: true });
    netChanged(); toast(Lg(`${d.p.name} katıldı`, `${d.p.name} joined`), 'ok');
    if (VOICE.on) callPeer(S.players[d.p.id]);
  } else if (d.t === 'leave') dropRemote(d.id);
  else if (d.t === 'prof') { const p = S.players[d.id]; if (p) { p.name = String(d.name || p.name).slice(0, 14); if (d.av) p.av = AV.fix(d.av); netChanged(); } }
  else if (d.t === 'mic') rxDrop(d.id);
  else if (d.t === 'vkstart') vkOpen(); else if (d.t === 'vks') vkRecv(d.s); else if (d.t === 'vkme') vkMe(d); else if (d.t === 'vkend') vkExit();
  else if (d.t === 'xg') XG.recv(d);
  else if (d.t === 'full') { netTeardown(); toast(Lg('Oda dolu', 'Room full'), 'err'); }
}

function showResult() {
  const r = S.round;
  const locLL = L.latLng(r.loc.lat, r.loc.lng);
  const guessLL = L.latLng(S.myGuess.lat, S.myGuess.lng);
  const dist = S.marker ? haversine(r.loc, S.myGuess) : CONFIG.NO_GUESS_KM;
  const dmg = Math.round(dist * 0.8);
  
  const pts = S.marker ? Math.round(5000 * Math.exp(-dist / 1492.7)) : 0;
  S.score = (S.score || 0) + pts;
  S.players[UID].hp = Math.max(0, S.players[UID].hp - dmg);

  $('#resultOv').style.display = 'block';
  if (S.rmap) S.rmap.invalidateSize();
  if (!S.rmap) {
    S.rmap = L.map('resMap', { center: [20, 0], zoom: 2, minZoom: 1, zoomControl: false, attributionControl: false });
    L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=' + ST.lang + '&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: '0123' }).addTo(S.rmap);
  }
  S.rObjs.forEach(o => o.remove()); S.rObjs = [];
  
  const m1 = L.marker(locLL, { icon: mkIcon('#fff', '🏁') }).addTo(S.rmap);
  S.rObjs.push(m1);

 {t:['Piyango! +$150','Lottery! +$150'],f:p=>{p.cash+=150;mc('coin')}},
 {t:['Doğum günü! +$50','Birthday! +$50'],f:p=>{p.cash+=50;mc('coin')}},

 {t:['Başlangıca git! +$200','Go to start! +$200'],f:p=>{p.pos=0;p.cash+=200;mc('coin')}},

 {t:['3 kare ileri','Forward 3'],f:async(p,ch)=>{await mMove(p,3);if(!ch&&M)await mLand(p,7,true)}},
 {t:['3 kare geri','Back 3'],f:async(p,ch)=>{p.pos=(p.pos+37)%40;mc('step');await sl(300);if(!ch&&M)await mLand(p,7,true)}}
];
const grp=g=>MT.map((t,i)=>t.t==='p'&&t.g===g?i:-1).filter(i=>i>=0);
const full=(pi,g)=>grp(g).every(i=>M.own[i]&&M.own[i].o===pi);
function rentOf(i,roll){
 const t=MT[i],ow=M.own[i];
 if(t.t==='p'){let r=t.r*(1+ow.lv*2);if(!ow.lv&&full(ow.o,t.g))r*=2;return r}
 const n=MT.filter((q,k)=>q.t===t.t&&M.own[k]&&M.own[k].o===ow.o).length;
 return t.t==='rr'?25*(1<<(n-1)):roll*(n>1?10:4);
}
function mStart(){
 ensureAudio();const pl=ensureBots(2,6);
 M={ps:pl.map(p=>({id:p.id,name:p.name,color:p.color,cash:1500,pos:0,jail:0,out:false,bot:p.id!==UID})),own:{},turn:0,dbl:0,phase:'idle',dice:[1,1],rollT:0,msg:'',info:null,over:null,gid:++gidN,hopT:0,hopP:null};
 open('mono');root().innerHTML='<canvas id="mCv" class="xpx" width="'+BS+'" height="'+BS+'"></canvas><div id="mSide"></div>';
 $('#mCv').addEventListener('pointerdown',e=>{if(!M)return;const r=e.target.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/r.width*11),cy=Math.floor((e.clientY-r.top)/r.height*11);for(let i=0;i<40;i++){const c=cell(i);if(c[0]===cx&&c[1]===cy){M.info=i;mc('click');mSide();break}}});
 mc('levelup');if(!mRaf)mRaf=requestAnimationFrame(mLoop);mTurn();
}
async function mTurn(){
 if(!M)return;const g=M.gid,p=M.ps[M.turn];M.phase='roll';mSide();
 if(p.bot){await sl(800);if(M&&M.gid===g)mRoll()}
}
async function mRoll(){
 if(!M||M.phase!=='roll')return;const g=M.gid,ok=()=>M&&M.gid===g,p=M.ps[M.turn];M.phase='busy';mSide();
 mc('dice');M.rollT=performance.now()+800;await sl(850);if(!ok())return;
 const a=1+rnd(6),b=1+rnd(6),dbl=a===b;M.dice=[a,b];M.rollT=0;let again=dbl,wasJail=false;
 if(p.jail>0){wasJail=true;
  if(dbl){p.jail=0;again=false}
  else{p.jail--;if(p.jail>0){M.msg=Lg('Hapistesin','In jail');mSide();await sl(900);if(ok())mEnd();return}mPay(p,50,null);if(p.out){mSide();await sl(800);if(ok())mEnd();return}}
 }
 if(again){M.dbl++;if(M.dbl>=3){mJail(p);mSide();await sl(900);if(ok())mEnd();return}}else M.dbl=0;
 await mMove(p,a+b);if(!ok())return;
 await mLand(p,a+b,false);if(!ok()||M.over)return;
 if(again&&!p.out&&p.jail===0&&!wasJail){M.phase='roll';mSide();if(p.bot){await sl(700);if(ok())mRoll()}return}
 mEnd();
}
async function mMove(p,n){for(let k=0;k<n;k++){p.pos=(p.pos+1)%40;if(p.pos===0){p.cash+=200;mc('coin')}M.hopT=performance.now();M.hopP=p.id;mc('step');mSide();await sl(170);if(!M)return}}
function mAsk(kind,i){return new Promise(r=>{M.ask={kind,i,r};M.phase='ask';mSide()})}
async function mLand(p,roll,ch){
 const i=p.pos,t=MT[i],g=M.gid,pi=M.ps.indexOf(p);M.info=i;
 if(t.t==='p'||t.t==='rr'||t.t==='ut'){
  const ow=M.own[i];
  if(!ow){if(p.cash>=t.p){const buy=p.bot?(p.cash-t.p>=100):await mAsk('buy',i);if(!M||M.gid!==g)return;if(buy){p.cash-=t.p;M.own[i]={o:pi,lv:0};mc('orb');M.msg=Lg('Satın alındı','Bought')+' '+t.n}}}
  else if(ow.o!==pi){const own=M.ps[ow.o],r=rentOf(i,roll);M.msg=`-$${r} → ${own.name}`;mPay(p,r,own);mSide();await sl(900)}
  else if(t.t==='p'&&ow.lv<4&&full(pi,t.g)){const cost=Math.ceil(t.p/20)*10;if(p.cash>=cost+(p.bot?300:0)){const up=p.bot?true:await mAsk('up',i);if(!M||M.gid!==g)return;if(up){p.cash-=cost;ow.lv++;mc('pop')}}}
 }
 else if(t.t==='tax'){M.msg='-$'+t.a;mc('bad');mPay(p,t.a,null);mSide();await sl(800)}
 else if(t.t==='ch'||t.t==='cc'){const c=pick(CH);M.msg=c.t[T()];mc('door');mSide();await sl(1300);if(!M||M.gid!==g)return;await c.f(p,ch)}
 else if(t.t==='gtj'){mJail(p);mSide();await sl(800)}
 if(M&&M.gid===g){mSide();await sl(300)}
}
function mPay(p,amt,to){if(p.out)return;if(p.cash>=amt){p.cash-=amt;if(to)to.cash+=amt;mc('coin')}else{if(to)to.cash+=p.cash;p.cash=0;mBank(p,to)}}
function mBank(p,to){p.out=true;const pi=M.ps.indexOf(p);Object.keys(M.own).forEach(k=>{if(M.own[k].o===pi){if(to){M.own[k].o=M.ps.indexOf(to);M.own[k].lv=0}else delete M.own[k]}});mc('boom');M.msg=p.name+' ✕'}
function mJail(p){p.pos=10;p.jail=3;M.dbl=0;mc('bad');M.msg=Lg('Hapse!','Jail!')}
function mEnd(){
 if(!M)return;const alive=M.ps.filter(p=>!p.out);
 if(alive.length<=1){M.over=alive[0]||M.ps[0];M.phase='over';mSide();mc('orbs');return}
 let k=M.turn;do{k=(k+1)%M.ps.length}while(M.ps[k].out);M.turn=k;M.dbl=0;mTurn();
}
function mSide(){
 const e=$('#mSide');if(!e||!M)return;const p=M.ps[M.turn],mine=!p.bot&&p.id===UID;let act='';
 if(M.over)act=`<div class="mWin">${avCanvas(M.over.id)}<h2 class="fr">${esc(M.over.name)}</h2></div><div class="mAct"><button class="btn primary big" data-ma="again">↻</button><button class="btn alt big" data-ma="lobby">←</button></div>`;
 else if(M.phase==='roll'&&mine)act=`<button class="btn primary big" data-ma="roll">${px('die','#10372c',4)}</button>`;
 else if(M.phase==='ask'&&M.ask){const t=MT[M.ask.i];act=M.ask.kind==='buy'?`<button class="btn primary big" data-ma="yes">✓ $${t.p}</button><button class="btn big" data-ma="no">✕</button>`:`<button class="btn primary big" data-ma="yes">▲ $${Math.ceil(t.p/20)*10}</button><button class="btn big" data-ma="no">✕</button>`}
 let info='';if(M.info!=null){const t=MT[M.info],ow=M.own[M.info];info=`<span class="mSw" style="background:${t.t==='p'?MG[t.g]:'#888'}"></span>${t.n}${t.p?' · $'+t.p:''}${ow?' · '+esc(M.ps[ow.o].name):''}`}
 e.innerHTML=`<div class="mPl">${M.ps.map((q,i)=>`<div class="mP ${i===M.turn&&!M.over?'on':''} ${q.out?'out':''}">${avCanvas(q.id)}<b>${esc(q.name)}</b><span>$${q.cash}</span></div>`).join('')}</div><div class="mAct">${act}</div><div class="mMsg">${M.msg||''}</div><div class="mInfo">${info}</div>`;
 setTimeout(avRepaintAll,0);
}
function mClick(e){
 const b=e.target.closest('[data-ma]');if(!b||!M)return;const a=b.dataset.ma;
 if(a==='again')return mStart();if(a==='lobby')return exit();

function drawDie(c,x,y,s,v){c.fillStyle='#14141c';c.fillRect(x,y,s,s);c.fillStyle='#f4f1e8';c.fillRect(x+1,y+1,s-2,s-2);c.fillStyle='#c9c3ad';c.fillRect(x+1,y+s-3,s-2,2);c.fillStyle='#14141c';const q=Math.floor((s-4)/3);PIPS[v].forEach(k=>c.fillRect(x+3+(k%3)*q+1,y+3+Math.floor(k/3)*q+1,Math.max(2,q-2),Math.max(2,q-2)))}
function drawTile(c,i,x,y){
 const t=MT[i],ow=M.own[i];c.fillStyle='#14141c';c.fillRect(x,y,CS,CS);c.fillStyle='#f0e6c6';c.fillRect(x+1,y+1,CS-2,CS-2);

  c.fillStyle=MG[t.g];c.fillRect(bx,by,bw,bh);
  for(let k=0;k<ow?.lv;k++){c.fillStyle='#f4f1e8';const hx=bw>bh?bx+3+k*6:bx+1,hy=bw>bh?by+1:by+3+k*6;c.fillRect(hx,hy,4,4);c.fillStyle='#d9373b';c.fillRect(hx+1,hy+1,2,2)}
  const s=String(t.p),z=(i<10||(i>20&&i<30))?2:1,gp=z===2?8:4;c.fillStyle='#2a1a10';const w=s.length*gp-z,sx=ax+Math.floor((aw-w)/2),sy=ay+Math.floor((ah-5*z)/2);
  [...s].forEach((d,k)=>F[d].forEach((r,j)=>{for(let m=0;m<3;m++)if(r[m]==='X')c.fillRect(sx+k*gp+m*z,sy+j*z,z,z)}));
 }else if(ICN[t.t]){const rows=ICN[t.t],w=rows[0].length*2,h=rows.length*2;c.fillStyle=ICC[t.t];rows.forEach((r,j)=>{for(let m=0;m<r.length;m++)if(r[m]==='X')c.fillRect(ax+Math.floor((aw-w)/2)+m*2,ay+Math.floor((ah-h)/2)+j*2,2,2)})}

 M.ps.forEach(p=>{if(p.out)return;const k=cnt[p.pos]=(cnt[p.pos]||0)+1,q=cell(p.pos),n=k-1,hop=M.hopP===p.id?Math.abs(Math.sin(Math.min(1,(now-M.hopT)/170)*Math.PI))*6:0;
